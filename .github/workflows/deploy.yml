name: Deploy

on:
  push:
    branches: [main]
  # Manual re-publish path: recover a failed publish for the current main
  # without waiting for a new merge.
  workflow_dispatch:
  # Weekly full rebuild so images pick up base-image/OS/security updates
  # even when application code is unchanged (path filtering alone would
  # let images age indefinitely).
  schedule:
    - cron: "30 3 * * 1"

concurrency:
  # Publish line must SERIALIZE, never cancel: concurrent merges queue so
  # every merged SHA gets fully published (no half-pushed :latest windows).
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  DB_URL: postgresql://jtrack:${{ secrets.DB_PASSWORD }}@localhost:5432/jtrack
  REDIS_URL: redis://localhost:6379
  KAFKA_BROKER: localhost:9092
  UTILS_SERVICE_URL: http://localhost:6001/api/utils
  FRONTEND_URL: http://localhost:3000
  JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
  JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
  JWT_RESET_SECRET: ${{ secrets.JWT_RESET_SECRET }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set-matrix.outputs.services }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            # Root dependency files affect EVERY service image — a lockfile-only
            # merge must rebuild all four, not publish nothing.
            auth:
              - 'services/auth/**'
              - 'packages/shared/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - '.npmrc'
            user:
              - 'services/user/**'
              - 'packages/shared/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - '.npmrc'
            jobservice:
              - 'services/jobservice/**'
              - 'packages/shared/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - '.npmrc'
            utils:
              - 'services/utils/**'
              - 'packages/shared/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - '.npmrc'

      - name: Build dynamic matrix
        id: set-matrix
        run: |
          # workflow_dispatch (re-publish) and schedule (weekly rebuild) always
          # publish the full set — paths-filter has no diff base on those events.
          if [[ "${{ github.event_name }}" != "push" ]]; then
            echo "services=[\"auth\",\"user\",\"jobservice\",\"utils\"]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          services='[]'
          if [[ '${{ steps.filter.outputs.auth }}' == 'true' ]]; then
            services=$(echo "$services" | jq -c '. + ["auth"]')
          fi
          if [[ '${{ steps.filter.outputs.user }}' == 'true' ]]; then
            services=$(echo "$services" | jq -c '. + ["user"]')
          fi
          if [[ '${{ steps.filter.outputs.jobservice }}' == 'true' ]]; then
            services=$(echo "$services" | jq -c '. + ["jobservice"]')
          fi
          if [[ '${{ steps.filter.outputs.utils }}' == 'true' ]]; then
            services=$(echo "$services" | jq -c '. + ["utils"]')
          fi
          echo "services=$services" >> "$GITHUB_OUTPUT"

  docker-build:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: jtrack
          POSTGRES_USER: jtrack
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jtrack"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      kafka:
        image: apache/kafka:4.2.0
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-topics.sh --list --bootstrap-server localhost:9092"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase registry
        id: reg
        run: echo "base=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Record image creation time
        id: meta
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          tags: |
            ${{ steps.reg.outputs.base }}/${{ matrix.service }}:${{ github.sha }}
            ${{ steps.reg.outputs.base }}/${{ matrix.service }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
          push: true
          cache-from: type=registry,ref=${{ steps.reg.outputs.base }}/${{ matrix.service }}:cache
          cache-to: type=registry,ref=${{ steps.reg.outputs.base }}/${{ matrix.service }}:cache,mode=max

      - name: Smoke test container
        run: |
          IMAGE="${{ steps.reg.outputs.base }}/${{ matrix.service }}:${{ github.sha }}"
          docker pull "$IMAGE"
          echo "Starting container..."
          CID=$(docker run -d --network host \
            -e "DB_URL=$DB_URL" \
            -e "REDIS_URL=$REDIS_URL" \
            -e "KAFKA_BROKER=$KAFKA_BROKER" \
            -e "JWT_ACCESS_SECRET=$JWT_ACCESS_SECRET" \
            -e "JWT_REFRESH_SECRET=$JWT_REFRESH_SECRET" \
            -e "JWT_RESET_SECRET=$JWT_RESET_SECRET" \
            -e "UTILS_SERVICE_URL=$UTILS_SERVICE_URL" \
            -e "FRONTEND_URL=$FRONTEND_URL" \
            "$IMAGE")
          for i in $(seq 1 10); do
            sleep 2
            RUNNING=$(docker inspect --format='{{.State.Running}}' "$CID" 2>/dev/null || echo "false")
            if [[ "$RUNNING" == "true" ]]; then
              echo "✓ Container running after $(( i * 2 ))s"
              docker stop "$CID" > /dev/null 2>&1 || true
              docker rm "$CID" > /dev/null 2>&1 || true
              exit 0
            fi
            if ! docker inspect "$CID" > /dev/null 2>&1; then
              echo "::error::Container exited before smoke check"
              docker logs "$CID" 2>&1 || true
              docker rm "$CID" > /dev/null 2>&1 || true
              exit 1
            fi
            echo "  Waiting... ($(( i * 2 ))s)"
          done
          echo "::error::Container not running after 20s"
          docker logs "$CID" 2>&1 || true
          docker stop "$CID" > /dev/null 2>&1 || true
          docker rm "$CID" > /dev/null 2>&1 || true
          exit 1

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.reg.outputs.base }}/${{ matrix.service }}:${{ github.sha }}
          exit-code: 0
          severity: CRITICAL,HIGH

  # Capture successful main-branch publications in the external Changelog
  # Composer (POST {runId, project, repo}; the Composer fetches run data itself).
  #
  # - push events ONLY: weekly security rebuilds (schedule) and manual
  #   re-publishes (workflow_dispatch) are deliberately NOT reported.
  # - docs-only merges (empty build matrix → docker-build skipped) ARE valid
  #   successful main pushes and are captured.
  # - Failed/cancelled publications are NEVER captured.
  # - Warning-only: a dead Composer must never fail an image publication.
  #   Re-running a fixed publish re-POSTs the same run_id, which the Composer
  #   treats idempotently (overwrite, not duplicate).
  # - No repo writes here → structurally incapable of triggering loops.
  changelog:
    name: Report run to Changelog Composer
    needs: [docker-build]
    if: >-
      always() &&
      github.event_name == 'push' &&
      needs.docker-build.result != 'failure' &&
      needs.docker-build.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: POST run to Changelog Composer
        env:
          COMPOSER_URL: ${{ secrets.COMPOSER_URL }}
          COMPOSER_TOKEN: ${{ secrets.COMPOSER_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$COMPOSER_URL" ] || [ -z "$COMPOSER_TOKEN" ]; then
            echo "::warning::COMPOSER_URL / COMPOSER_TOKEN secrets not configured — skipping changelog capture"
            exit 0
          fi

          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY##*/}"

          http=$(curl -sS -o /tmp/composer-response.json -w '%{http_code}' \
            -X POST "$COMPOSER_URL" \
            -H "Authorization: Bearer $COMPOSER_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --argjson runId "$GITHUB_RUN_ID" \
              --arg project "$OWNER" \
              --arg repo "$REPO" \
              '{runId: $runId, project: $project, repo: $repo}')"
          ) || http=000

          if [ "$http" != "200" ]; then
            echo "::warning::Changelog Composer unreachable (HTTP $http) — run not captured; publication is unaffected"
            exit 0
          fi

          pr_count=$(jq -r '.prCount // 0' /tmp/composer-response.json)
          echo "✓ Run $GITHUB_RUN_ID captured by Changelog Composer ($pr_count PRs)"
