name: Kafka Cred Sync (temp)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Install kcat
        run: sudo apt-get update -qq && sudo apt-get install -y -qq kcat

      - name: Validate GH-stored Kafka credentials against broker
        env:
          KAFKA_BROKER: ${{ secrets.KAFKA_BROKER }}
          KAFKA_SASL_USERNAME: ${{ secrets.KAFKA_SASL_USERNAME }}
          KAFKA_SASL_PASSWORD: ${{ secrets.KAFKA_SASL_PASSWORD }}
          KAFKA_SASL_MECHANISM: ${{ secrets.KAFKA_SASL_MECHANISM }}
        run: |
          set -euo pipefail
          HOSTPORT=${KAFKA_BROKER#*://}
          if timeout 30 kcat -b "$HOSTPORT" -m 25 \
            -X security.protocol=SASL_SSL \
            -X sasl.mechanisms="$KAFKA_SASL_MECHANISM" \
            -X sasl.username="$KAFKA_SASL_USERNAME" \
            -X sasl.password="$KAFKA_SASL_PASSWORD" -L > /tmp/kcat.out 2>&1; then
            echo "KCAT_AUTH=PASS" >> "$GITHUB_ENV"
            echo "✓ GH-stored Kafka credentials are VALID"
          else
            grep -iE "error|auth" /tmp/kcat.out | sed 's/.*ERROR/ERROR/' | head -3 || true
            echo "✗ GH-stored Kafka credentials FAILED"
            exit 1
          fi

      - name: Compare with VM and sync if different
        if: env.KCAT_AUTH == 'PASS'
        env:
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          NEW_BROKER: ${{ secrets.KAFKA_BROKER }}
          NEW_USER: ${{ secrets.KAFKA_SASL_USERNAME }}
          NEW_PASS: ${{ secrets.KAFKA_SASL_PASSWORD }}
          NEW_MECH: ${{ secrets.KAFKA_SASL_MECHANISM }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null key
          echo "$SSH_KEY" > key
          ssh -i key -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" \
            'bash -s' -- "$NEW_BROKER" "$NEW_USER" "$NEW_PASS" "$NEW_MECH" <<'REMOTE'
          set -euo pipefail
          cd /opt/jtrack
          BROKER="$1"; NUSER="$2"; NPASS="$3"; NMECH="$4"
          cp .env ".env.bak.kafka.$(date +%s)"
          sed -i "s|^KAFKA_BROKER=.*|KAFKA_BROKER=${BROKER}|" .env
          sed -i "s|^KAFKA_SASL_USERNAME=.*|KAFKA_SASL_USERNAME=${NUSER}|" .env
          sed -i "s|^KAFKA_SASL_PASSWORD=.*|KAFKA_SASL_PASSWORD=${NPASS}|" .env
          sed -i "s|^KAFKA_SASL_MECHANISM=.*|KAFKA_SASL_MECHANISM=${NMECH}|" .env
          echo "VM_KAFKA=UPDATED"
          docker compose --env-file versions.env up -d --force-recreate auth user jobservice utils
          REMOTE
          rm -f key

      - name: Wait for backend health after sync
        env:
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null key
          echo "$SSH_KEY" > key
          sleep 20
          ssh -i key -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" \
            'docker ps --format "{{.Names}} {{.Status}}" | sort'
          rm -f key
