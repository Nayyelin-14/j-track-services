# For other developers: everything runs locally in Docker except Kafka.
# Uses local Redis + Confluent Cloud Kafka (configured via .env).
services:
  redis:
    image: redis:7-alpine
    container_name: jtrack-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: jtrack-auth
    depends_on:
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      PORT: 7000
      REDIS_URL: redis://redis:6379
      UTILS_SERVICE_URL: http://utils:6001/api/utils

  user:
    build:
      context: .
      dockerfile: services/user/Dockerfile
    container_name: jtrack-user
    depends_on:
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      PORT: 7001
      REDIS_URL: redis://redis:6379
      UTILS_SERVICE_URL: http://utils:6001/api/utils

  jobservice:
    build:
      context: .
      dockerfile: services/jobservice/Dockerfile
    container_name: jtrack-job
    depends_on:
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      PORT: 7002
      REDIS_URL: redis://redis:6379
      UTILS_SERVICE_URL: http://utils:6001/api/utils

  utils:
    build:
      context: .
      dockerfile: services/utils/Dockerfile
    container_name: jtrack-utils
    env_file: .env
    environment:
      PORT: 6001

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: jtrack-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/compose/conf.d/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - auth
      - user
      - jobservice
      - utils
