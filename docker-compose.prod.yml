# Production deployment.
# Services are pre-built by CI and pushed to GHCR.
# Set GHCR_REPO env var or replace ghcr.io/your-org/your-repo below.
#
# Image versions are pinned to immutable Git SHA tags via versions.env
# (loaded with `docker compose --env-file versions.env`). Every tag is
# REQUIRED — Compose refuses to run if any is unset, so production can
# never silently fall back to :latest.

services:
  redis:
    image: redis:7-alpine
    container_name: jtrack-redis
    restart: unless-stopped
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth:
    image: ${GHCR_REPO:?GHCR_REPO required in versions.env}/auth:${AUTH_TAG:?AUTH_TAG required}
    container_name: jtrack-auth
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      PORT: 7000
      REDIS_URL: redis://redis:6379
      UTILS_SERVICE_URL: http://utils:6001/api/utils

  user:
    image: ${GHCR_REPO:?GHCR_REPO required in versions.env}/user:${USER_TAG:?USER_TAG required}
    container_name: jtrack-user
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      PORT: 7001
      REDIS_URL: redis://redis:6379
      UTILS_SERVICE_URL: http://utils:6001/api/utils

  jobservice:
    image: ${GHCR_REPO:?GHCR_REPO required in versions.env}/jobservice:${JOBSERVICE_TAG:?JOBSERVICE_TAG required}
    container_name: jtrack-job
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      PORT: 7002
      REDIS_URL: redis://redis:6379
      UTILS_SERVICE_URL: http://utils:6001/api/utils

  utils:
    image: ${GHCR_REPO:?GHCR_REPO required in versions.env}/utils:${UTILS_TAG:?UTILS_TAG required}
    container_name: jtrack-utils
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 6001

  frontend:
    image: ${GHCR_REPO:?GHCR_REPO required in versions.env}/frontend:${FRONTEND_TAG:?FRONTEND_TAG required}
    container_name: jtrack-frontend
    restart: unless-stopped
    depends_on:
      - auth
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_USE_MOCK: "false"
      # proxy.ts (server-side role guards) calls the auth service directly —
      # internal docker DNS, never exposed to the host.
      AUTH_API_INTERNAL: http://auth:7000/api
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/login"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile.prod
    container_name: jtrack-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/prod/conf.d/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/ssl/fullchain.pem:/etc/nginx/ssl/fullchain.pem:ro
      - ./nginx/ssl/privkey.pem:/etc/nginx/ssl/privkey.pem:ro
    depends_on:
      - auth
      - user
      - jobservice
      - utils
      - frontend
