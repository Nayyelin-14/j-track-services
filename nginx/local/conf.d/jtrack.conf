# Local dev nginx config for J-Track (no Docker, nginx installed natively)
# Proxies to services running via `pnpm dev` on localhost ports.
# Install via: bash scripts/setup-nginx-native.sh
# This file is project-specific (installed as /etc/nginx/sites-available/jtrack
# with a sites-enabled symlink) so it coexists with other projects on this machine.

server {
    listen 80;
    listen [::]:80;
    # WSL2's localhost relay often skips privileged ports (<1024),
    # so also serve on 8080 for browser access from Windows.
    listen 8080;
    server_name jtrack.localhost localhost;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Health
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Frontend (Next.js)
    # Dev-mode HMR websocket needs the Upgrade headers below.
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Auth service
    location /api/auth/ {
        proxy_pass http://localhost:7000;
    }

    # User service
    location /api/users/ {
        proxy_pass http://localhost:7001;
    }

    # Job service
    location /api/jobs/ {
        proxy_pass http://localhost:7002;
    }

    # Utils service (file uploads need larger body size)
    location /api/utils/ {
        client_max_body_size 50m;
        proxy_pass http://localhost:6001;
    }

    # SSE endpoint — disable buffering
    location /api/jobs/analyze-match/ {
        proxy_pass http://localhost:7002;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        # Align with the services' own stream deadlines so long
        # AI generations aren't cut by nginx's 60s default.
        proxy_read_timeout 120s;
    }

    # AI service (SSE streaming) — disable buffering
    location /api/ai/ {
        proxy_pass http://localhost:6001;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 120s;
    }
}